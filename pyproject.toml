[project]
name = "rag-evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yash", email = "yashh2417@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.6",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fonttools>=4.66.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.6.6",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-evals = "rag_evals:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
